name: apply-v0.3.0-source-update

on:
  push:
    branches:
      - agent/v0.3.0-test-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'run v0.3.0 source update'
    runs-on: windows-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.3.0-test-ui
          fetch-depth: 0

      - name: Apply source archive
        shell: pwsh
        run: |
          $payload = Get-Content ".github/kuaiyun-v0.3.0-update.zip.b64" -Raw
          $zip = Join-Path $env:RUNNER_TEMP "kuaiyun-update.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($payload))
          Expand-Archive -Path $zip -DestinationPath "." -Force
          Remove-Item ".github/kuaiyun-v0.3.0-update.zip.b64" -Force

      - name: Commit source update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply v0.3.0 test UI and client features"
          git push origin HEAD:agent/v0.3.0-test-ui
