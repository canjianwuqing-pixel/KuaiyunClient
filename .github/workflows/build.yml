name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Mihomo
        shell: pwsh
        run: .\scripts\download-mihomo.ps1

      - name: Build
        shell: pwsh
        run: dotnet build .\src\KuaiyunClient\KuaiyunClient.csproj -c Release

      - name: Publish compact Windows x64 package
        shell: pwsh
        run: >-
          dotnet publish .\src\KuaiyunClient\KuaiyunClient.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\KuaiyunClient-win-x64

      - name: Verify compact package
        shell: pwsh
        run: |
          $package = ".\artifacts\KuaiyunClient-win-x64"
          $required = @(
            "$package\KuaiyunClient.exe",
            "$package\bootstrap.json",
            "$package\core\mihomo.exe",
            "$package\core\version.txt"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required package file: $path"
            }
          }

          $topLevelFiles = Get-ChildItem $package -File
          $unexpected = $topLevelFiles | Where-Object {
            $_.Name -notin @("KuaiyunClient.exe", "bootstrap.json")
          }

          if ($unexpected) {
            $names = ($unexpected.Name -join ", ")
            throw "Unexpected top-level package files: $names"
          }

          $appSize = (Get-Item "$package\KuaiyunClient.exe").Length
          if ($appSize -lt 10MB) {
            throw "KuaiyunClient.exe is unexpectedly small; .NET runtime may not be bundled."
          }

          Write-Host "Compact package verified."
          Write-Host "Top-level files: $($topLevelFiles.Name -join ', ')"
          Write-Host "Application size: $([Math]::Round($appSize / 1MB, 2)) MB"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $isccPath = if ($command) { $command.Source } else { $null }

          if (-not $isccPath) {
            choco install innosetup --yes --no-progress
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            $isccPath = if ($command) { $command.Source } else { $null }
          }

          if (-not $isccPath) {
            $fallback = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $fallback) {
              $isccPath = $fallback
            }
          }

          if (-not $isccPath) {
            throw "Inno Setup compiler was not found."
          }

          & $isccPath .\installer\KuaiyunClient.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = ".\artifacts\installer\KuaiyunClient-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Missing installer: $installer"
          }

          $size = (Get-Item $installer).Length
          if ($size -lt 10MB) {
            throw "Installer is unexpectedly small."
          }

          Write-Host "Installer size: $([Math]::Round($size / 1MB, 2)) MB"

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: KuaiyunClient-win-x64-portable
          path: artifacts/KuaiyunClient-win-x64/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KuaiyunClient-Setup
          path: artifacts/installer/KuaiyunClient-Setup.exe
          if-no-files-found: error
