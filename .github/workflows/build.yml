name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply v0.3.0 source update
        if: ${{ hashFiles('.github/update-parts/part16.txt') != '' }}
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          $rawPayload = (Get-ChildItem ".github/update-parts" -Filter "part*.txt" -File |
            Sort-Object Name |
            ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $payload = [regex]::Replace($rawPayload, '[^A-Za-z0-9+/=]', '')
          Write-Host "Raw payload length: $($rawPayload.Length)"
          Write-Host "Sanitized payload length: $($payload.Length)"
          if ($payload.Length -ne 71604) {
            throw "Unexpected payload length: $($payload.Length), expected 71604."
          }

          $zip = Join-Path $env:RUNNER_TEMP "kuaiyun-v0.3.0-update.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($payload))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "1dd26db5ca802c20df6de464591ebf65d0e38c76c55338d2ee6f0feb63b53f38") {
            throw "Source archive SHA256 mismatch: $hash"
          }

          Expand-Archive -Path $zip -DestinationPath "." -Force
          Remove-Item ".github/update-parts" -Recurse -Force
          Remove-Item ".github/kuaiyun-v0.3.0-update.zip.b64" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github/workflows/apply-v0.3.0-update.yml" -Force -ErrorAction SilentlyContinue

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply v0.3.0 test UI and client features"

          if ($env:GITHUB_EVENT_NAME -eq "pull_request" -and -not [string]::IsNullOrWhiteSpace($env:TARGET_BRANCH)) {
            git push origin "HEAD:$env:TARGET_BRANCH"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Mihomo and offline Geo data
        shell: pwsh
        run: .\scripts\download-mihomo.ps1

      - name: Download offline country flags
        shell: pwsh
        run: .\scripts\download-flags.ps1

      - name: Build
        shell: pwsh
        run: dotnet build .\src\KuaiyunClient\KuaiyunClient.csproj -c Release
