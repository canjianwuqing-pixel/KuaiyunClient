name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        shell: pwsh
        run: dotnet build .\src\KuaiyunClient\KuaiyunClient.csproj -c Release
